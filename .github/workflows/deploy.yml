# 合并进 main 后：复用 ci 检查，再部署 Supabase。
# Web 不在这里部署。Vercel 连着本仓库：合并进 main 发布生产，其他分支发布预览。
#
# 仓库 Secrets：
#   SUPABASE_ACCESS_TOKEN
#   SUPABASE_PROJECT_REF
#   SUPABASE_DB_PASSWORD
# 可选：LINX_API_KEY、LINX_API_BASE
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-supabase-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check secrets
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "缺少 SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "$SUPABASE_PROJECT_REF" || { echo "缺少 SUPABASE_PROJECT_REF"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "缺少 SUPABASE_DB_PASSWORD"; exit 1; }

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Push database migrations
        run: supabase db push

      - name: Set function secrets
        env:
          LINX_API_KEY: ${{ secrets.LINX_API_KEY }}
          LINX_API_BASE: ${{ secrets.LINX_API_BASE }}
        run: |
          supabase secrets set \
            PUBLIC_BASE_URL="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/game/mcp"
          if [ -n "${LINX_API_KEY:-}" ]; then
            supabase secrets set \
              LINX_API_KEY="$LINX_API_KEY" \
              LINX_API_BASE="${LINX_API_BASE:-https://xrobo.qiniu.com}"
          fi

      - name: Deploy game function
        run: |
          supabase functions deploy game --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"
          echo "MCP URL: https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/game/mcp"
